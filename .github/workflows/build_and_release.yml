name: Build & Release Ayushflix

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NOTE: APK and Windows Desktop builds are temporarily disabled for this DMG-only release run
  # as requested, since they are already built and attached to release v2.1.7.
  #
  # build-apk: ...
  # build-desktop: ...

  build-macos:
    name: Build macOS Client (.dmg) (${{ matrix.display_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            display_name: AppleSilicon
            dmg_name: Ayushflix-macOS-AppleSilicon.dmg
          - os: macos-15-intel
            arch: x86_64
            display_name: Intel
            dmg_name: Ayushflix-macOS-Intel.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install MPV via Homebrew
        run: |
          brew install mpv || true
          mkdir -p desktop/desktop-app/appResources/macos/mpv
          # Copy libmpv dylib from brew prefix into appResources
          BREW_PREFIX=$(brew --prefix mpv 2>/dev/null || true)
          if [ -n "$BREW_PREFIX" ] && [ -d "$BREW_PREFIX" ]; then
            cp -L "$BREW_PREFIX"/lib/libmpv*.dylib desktop/desktop-app/appResources/macos/mpv/ 2>/dev/null || true
          fi

      - name: Build macOS Distributable & DMG
        run: |
          cd desktop
          chmod +x gradlew
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          if [[ -z "$VER" || "$VER" == main* ]]; then VER="1.0.0"; fi
          ./gradlew :desktop-app:packageDmg "-PAPP_VERSION=$VER" --no-daemon --stacktrace

      - name: Prepare DMG Assets
        run: |
          mkdir -p release_assets
          DMG_FILE=$(find desktop/desktop-app/build/compose/binaries/main/dmg -name "*.dmg" | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            echo "Error: DMG file not found!"
            exit 1
          fi
          echo "Found DMG: $DMG_FILE"
          cp "$DMG_FILE" "release_assets/${{ matrix.dmg_name }}"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            cp "$DMG_FILE" "release_assets/Ayushflix-Desktop-2.1.7.dmg"
          fi
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp "$DMG_FILE" "release_assets/Ayushflix-Desktop-2.1.7-Intel.dmg"
          fi

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: release_assets/*.dmg
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos]
    runs-on: ubuntu-latest
    if: always() && needs.build-macos.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true))

    steps:
      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'macos-dmg-*'
          merge-multiple: true
          path: release_files

      - name: Determine Tag
        id: tag_info
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v2.1.7"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag_name }}
          name: "Ayushflix ${{ steps.tag_info.outputs.tag_name }}"
          body: |
            ## Ayushflix ${{ steps.tag_info.outputs.tag_name }}

            **Universal update released with auto update enabled**

            ### macOS Client (Apple Silicon & Intel)
            - **macOS Compatibility Fix**: Resolved compatibility with older macOS versions including macOS 12 Monterey and macOS 11 Big Sur (`minimumSystemVersion = 11.0`).
            - **Dedicated Intel (x86_64) Package**: `Ayushflix-macOS-Intel.dmg` (and `Ayushflix-Desktop-2.1.7-Intel.dmg`) for Intel MacBooks, MacBook Air, MacBook Pro, and iMacs (resolves Issue #5).
            - **Dedicated Apple Silicon (ARM64) Package**: `Ayushflix-macOS-AppleSilicon.dmg` (and `Ayushflix-Desktop-2.1.7.dmg`) for M1/M2/M3/M4 Macs.

            ### Android Client (Mobile & TV)
            - **Audio Track Selection Fix**: Resolved issue where audio track selection remained stuck on Hindi; user track and language intent in the tracks dialog is now fully respected.
            - **TV Search UI Fix**: Resolved crash where Android TV search failed with missing view ID (`search_section_title`).
            - **Liquid Glass Navigation Pill**: Redesigned floating bottom navigation pill with frosted glass indicator and crystal-clear icons.
            - **Who's Watching?**: Netflix-style startup profile selection screen with animated avatars.
            - **Enhanced Top Match**: Enlarged card layout with high-resolution poster display and instant play button.
            - **Hero Banner Auto-Advance**: Seamless auto-advance across featured titles.
            - **Universal TV & Mobile Device Routing**: Dynamically detects TV vs Mobile devices.
            - **Castle TV Included**: Available on both Mobile and TV with default Hindi audio priority.
            - **Dynamic Playback Source Branding**: Streams dynamically branded (`Ayushflix - Netflix`, `Ayushflix - Prime Video`, `Ayushflix - Hotstar`, `Ayushflix - Disney`, and `Ayushflix` for Castle TV).
            - **Auto-Update Enabled**: Built-in background auto-sync directly from NivinCNC's official repository.

            ### Windows Desktop Client
            - **Native High-Performance MPV Video Player**: Built-in Direct3D / JNI playback engine with libmpv.
            - **All Scrapers Pre-Bundled**: CNC Verse, CNC Verse Mobile, Castle TV, and unified Ayushflix extension pre-installed out-of-the-box.
            - **Standalone Installer**: Clean Windows installation package (`Ayushflix-Setup.exe`).
            - **Auto-Updating Repository**: Auto-syncs scraper extensions directly from `jaatayushh/ayushflix-extention`.
          files: release_files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
