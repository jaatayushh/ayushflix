name: Build & Release Ayushflix

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Stable Release APK
        run: ./gradlew assembleStableRelease --stacktrace

      - name: Prepare Release Asset
        id: prepare_asset
        run: |
          mkdir -p release_assets
          APK_FILE=$(find app/build/outputs/apk/stable/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v2.0.7"
          fi
          ASSET_NAME="Ayushflix-${TAG}.apk"
          cp "$APK_FILE" "release_assets/${ASSET_NAME}"
          echo "asset_path=release_assets/${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_asset.outputs.asset_name }}
          path: ${{ steps.prepare_asset.outputs.asset_path }}
          retention-days: 30

  build-desktop:
    name: Build Windows Desktop Client
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          build-root-directory: desktop

      - name: Download libmpv-2.dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/desktop-app/appResources/windows/mpv"
          Write-Host "Fetching libmpv build from shinchiro/mpv-winbuild-cmake..."
          $headers = @{
            "Accept" = "application/vnd.github.v3+json"
            "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
          }
          $release = $null
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/tags/20260610" -Headers $headers
          } catch {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          }
          $asset = $release.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" } | Select-Object -First 1
          Write-Host "Downloading: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "mpv-dev.7z"
          7z e mpv-dev.7z "libmpv-2.dll" -o"desktop/desktop-app/appResources/windows/mpv" -r
          if (-not (Test-Path "desktop/desktop-app/appResources/windows/mpv/libmpv-2.dll")) {
            Write-Error "libmpv-2.dll was not extracted!"
            exit 1
          }
          Write-Host "libmpv-2.dll ready."

      - name: Build Desktop Distributable
        shell: pwsh
        run: |
          cd desktop
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } elseif (Test-Path "C:\Android\android-sdk") { "C:\Android\android-sdk" } else { "$env:LOCALAPPDATA\Android\Sdk" }
          Write-Host "Using Android SDK at: $sdk"
          "sdk.dir=$($sdk.Replace('\', '/'))" | Out-File -Encoding utf8 "local.properties"
          ./gradlew.bat :desktop-app:createDistributable -PAPP_VERSION=1.0.0 --no-daemon --stacktrace

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Compile Windows Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          cd desktop
          & $iscc "installer\setup.iss"

      - name: Upload Desktop Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayushflix-Setup.exe
          path: desktop/desktop-app/build/outputs/Ayushflix-Setup.exe
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: 'Ayushflix-*.apk'
          merge-multiple: true
          path: release_files

      - name: Download Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: Ayushflix-Setup.exe
          path: release_files

      - name: Determine Tag
        id: tag_info
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v2.0.7"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag_name }}
          name: "Ayushflix ${{ steps.tag_info.outputs.tag_name }}"
          body: |
            ## Ayushflix ${{ steps.tag_info.outputs.tag_name }}

            **Universal update released with auto update enabled**

            ### Android Client (Mobile & TV)
            - **Universal TV & Mobile Device Routing**: Dynamically detects TV vs Mobile devices:
              - Mobile gets CNC Verse Mobile (`NetflixM`, `PrimeVideoM`, `HotstarM`, `DisneyM`) with default home set to `NetflixM`.
              - TV gets CNC Verse TV (`Netflix Mirror`, `Prime Video`, `Hotstar`, `Disney`) with default home set to `Netflix Mirror`.
            - **Castle TV Included**: Available on both Mobile and TV with default Hindi audio priority.
            - **Dynamic Playback Source Branding**: Streams dynamically branded (`Ayushflix - Netflix`, `Ayushflix - Prime Video`, `Ayushflix - Hotstar`, `Ayushflix - Disney`, and `Ayushflix` for Castle TV).
            - **Border-Free Floating Logo**: Completely transparent squircle icon on all Android DPIs.
            - **Auto-Update Enabled**: Built-in background auto-sync directly from NivinCNC's official repository.

            ### Windows Desktop Client
            - **Native High-Performance MPV Video Player**: Built-in Direct3D / JNI playback engine with libmpv.
            - **All Scrapers Pre-Bundled**: CNC Verse, CNC Verse Mobile, Castle TV, and unified Ayushflix extension pre-installed out-of-the-box.
            - **Standalone Installer**: Clean Windows installation package (`Ayushflix-Setup.exe`).
            - **Auto-Updating Repository**: Auto-syncs scraper extensions directly from `jaatayushh/ayushflix-extention`.
          files: release_files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
