<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayushflix</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/dash.all.min.js"></script>
  <script src="vendor/hls.min.js"></script>
</head>
<body>
  <!-- Top Navigation Header -->
  <header class="navbar">
    <div class="nav-left">
      <div class="brand-logo" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <span class="logo-ayush">AYUSH</span><span class="logo-flix">FLIX</span>
      </div>
      <nav class="nav-links">
        <a href="#trending" class="nav-item active">Home</a>
        <a href="#bollywood" class="nav-item">Bollywood</a>
        <a href="#south_indian" class="nav-item">South Indian</a>
        <a href="#hollywood" class="nav-item">Hollywood</a>
        <a href="#series" class="nav-item">Web Series</a>
      </nav>
    </div>
    <div class="nav-right">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" placeholder="Search movies, web series..." autocomplete="off">
        <button id="searchClear" class="clear-btn">&times;</button>
      </div>
    </div>
  </header>

  <!-- Main Feed -->
  <main id="mainContent">
    <!-- Hero Billboard Banner -->
    <section class="hero-banner" id="heroBanner">
      <div class="hero-backdrop" id="heroBackdrop"></div>
      <div class="hero-overlay"></div>
      <div class="hero-details">
        <div class="hero-badge">FEATURED</div>
        <h1 class="hero-title" id="heroTitle">Ayushflix</h1>
        <div class="hero-meta">
          <span class="rating-badge" id="heroRating">★ 8.5</span>
          <span class="type-badge" id="heroType">MOVIE</span>
        </div>
        <div class="hero-actions">
          <button class="btn btn-primary" id="heroPlayBtn">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
            Play Now
          </button>
          <button class="btn btn-secondary" id="heroInfoBtn">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            More Info
          </button>
        </div>
      </div>
    </section>

    <!-- Search Results Grid (Hidden by default) -->
    <section id="searchResultsSection" class="search-section" style="display: none;">
      <div class="section-header">
        <h2 id="searchHeading">Search Results</h2>
      </div>
      <div class="movie-grid" id="searchGrid"></div>
    </section>

    <!-- Category Carousel Rows -->
    <section id="feedRows" class="feed-rows"></section>
  </main>

  <!-- Details Modal -->
  <div class="modal-overlay" id="detailsModal">
    <div class="modal-container">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal-content">
        <div class="modal-left">
          <img class="modal-poster" id="modalPoster" src="" alt="Poster">
        </div>
        <div class="modal-right">
          <h2 class="modal-title" id="modalTitle">Title</h2>
          <div class="modal-meta">
            <span class="rating-badge" id="modalRating">★ 8.5</span>
            <span class="year-badge" id="modalYear">2024</span>
            <span class="duration-badge" id="modalDuration">2h 15m</span>
            <span class="type-badge" id="modalType">MOVIE</span>
          </div>
          <div class="modal-genres" id="modalGenres">Action, Drama</div>
          <p class="modal-desc" id="modalDesc">Description goes here...</p>

          <!-- Audio Dub Selector -->
          <div class="dubs-container" id="modalDubsContainer">
            <label class="section-label">Audio Language (Hindi Default):</label>
            <div class="dubs-list" id="modalDubsList"></div>
          </div>

          <!-- Play Action -->
          <div class="modal-actions" id="modalActions">
            <button class="btn btn-primary btn-lg" id="modalPlayBtn">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
              Play
            </button>
          </div>

          <!-- Series Seasons & Episodes -->
          <div class="series-section" id="seriesSection" style="display: none;">
            <div class="season-tabs" id="seasonTabs"></div>
            <div class="episodes-grid" id="episodesGrid"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Video Player Overlay -->
  <div class="player-overlay" id="playerOverlay">
    <div class="player-topbar" id="playerTopbar">
      <button class="back-btn" id="playerClose">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <span class="player-title" id="playerTitle">Playing</span>
      <div class="player-audio-badge" id="playerAudioBadge">Hindi Audio</div>
    </div>

    <div class="video-wrapper" id="videoWrapper">
      <video id="videoPlayer" playsinline></video>
      <div class="spinner" id="playerSpinner"></div>
    </div>

    <div class="player-controls" id="playerControls">
      <!-- Scrub Bar -->
      <div class="timeline-container">
        <input type="range" id="timeline" min="0" max="100" value="0" step="0.1">
        <div class="timeline-buffered" id="timelineBuffered"></div>
      </div>

      <!-- Controls Row -->
      <div class="controls-row">
        <div class="controls-left">
          <button class="ctrl-btn" id="btnPlayPause">
            <svg id="iconPlay" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
            <svg id="iconPause" viewBox="0 0 24 24" style="display:none;"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="ctrl-btn" id="btnRewind" title="Rewind 10s">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
          </button>
          <button class="ctrl-btn" id="btnForward" title="Forward 10s">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
          </button>
          <div class="volume-container">
            <button class="ctrl-btn" id="btnMute">
              <svg id="iconVolHigh" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg id="iconVolMuted" viewBox="0 0 24 24" style="display:none;"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1">
          </div>
          <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
        </div>

        <div class="controls-right">
          <button class="ctrl-btn" id="btnFullscreen" title="Fullscreen (F)">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="player.js"></script>
  <script src="app.js"></script>
</body>
</html>
